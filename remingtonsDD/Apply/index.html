ducts:[])))){const e=document.createElement("div");e.className="product";e.textContent=p;document.getElementById("products").append(e)}const announcement=document.getElementById("announcement");announcement.textContent=b.showAnnouncement===false?"":b.announcement||"";announcement.hidden=!announcement.textContent;document.getElementById("products-section").hidden=b.showProducts===false||!(b.products?.length?b.products:(id==="digital-den"?businesses["digital-den"].products:[])).length}display(b);</script><script type="module">import{getApps,getApp,initializeApp}from"https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";import{getAuth,signInAnonymously}from"https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";import{getFirestore,doc,onSnapshot,collection,setDoc,serverTimestamp}from"https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";import{firebaseConfig}from"/firebase-config.js";const id=(new URLSearchParams(location.search).get("id")||"digital-den");const form=document.getElementById("application-form"),hiring=document.getElementById("hiring"),hiringStatus=document.getElementById("hiring-status");let hiringOpen=false,auth,db,extraQuestions=[];function selectBusinessTab(tab){const apply=tab==="apply"&&!document.getElementById("tab-apply").hidden;for(const key of ["about","apply"]){const active=key===(apply?"apply":"about");document.getElementById("panel-"+key).hidden=!active;document.getElementById("tab-"+key).setAttribute("aria-selected",String(active))}}document.querySelectorAll("[data-tab]").forEach(button=>button.addEventListener("click",()=>{if(button.dataset.tab==="about"){location.href="/business/?id=digital-den";return}selectBusinessTab("apply");history.replaceState(null,"","/remingtonsDD/Apply")}));const defaults=["Character name","Discord username / contact","Past experience","Why do you want to work here?","Availability"];function renderQuestions(b){const dd=id==="digital-den";const labels=dd?["What is your full in-character name alue.trim(),availability:document.getElementById("app-availability").value.trim(),extraAnswers:extraQuestions.map((question,i)=>({question,answer:document.getElementById("app-extra-"+i).value.trim()})),status:"pending",createdAt:serverTimestamp()};await setDoc(doc(db,"applications",id+"_"+user.uid),data);hiringStatus.textContent="Application submitted successfully.";form.reset()}catch(err){hiringStatus.textContent="Could not submit: "+err.message}});if(id&&firebaseConfig.projectId){const app=getApps().length?getApp():initializeApp(firebaseConfig);db=getFirestore(app);auth=getAuth(app);onSnapshot(doc(db,"businesses",id),snap=>{if(!snap.exists())return;const b=snap.data();renderQuestions(b);hiringOpen=b.hiringOpen===true&&b.status!=="past";hiring.hidden=!hiringOpen;document.getElementById("tab-apply").hidden=!hiringOpen;if(!hiringOpen)selectBusinessTab("about");else selectBusinessTab("apply");hiringStatus.textContent=hiringOpen?"Applications are open. No account needed.":"";document.title=b.name+" | StuckLevel75";document.getElementById("name").textContent=b.name;document.getElementById("status").textContent=b.status==="past"?"Past Business":"Active Business";document.getElementById("description").textContent=b.description||"";document.getElementById("details").textContent=b.details||b.description||"";document.getElementById("hero").style.borderColor=b.color||"#714d8f";document.getElementById("products").replaceChildren();for(const p of (b.showProducts===false?[]:b.products||[])){const e=document.createElement("div");e.className="product";e.textContent=p;document.getElementById("products").append(e)}const announcement=document.getElementById("announcement");announcement.textContent=b.showAnnouncement===false?"":b.announcement||"";announcement.hidden=!announcement.textContent;document.getElementById("products-section").hidden=b.showProducts===false||!(b.products||[]).length;document.getElementById("hero").classList.toggle("past",b.status==="past")},err=>console.warn("Business unavailable",err.code))}</script></body></html>
